[project]
name = "adcssim"
version = "0.0.0"
description = "CubeSat attitude determination and control simulator: Python simulation and visualization, ADCS in C and Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jordi Mata Garcia", email = "157473246+jordimatagarcia@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=16.0",
    "sgp4>=2.23",
]

[project.scripts]
adcssim = "adcssim.cli:main"

[project.optional-dependencies]
viz = [
    "pillow>=10.0",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
]

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-qt>=4.5.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH"]
# Maths notation (×, −, θ, …) is used deliberately in docstrings and comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sgp4.*", "pyarrow.*", "pyqtgraph.*", "pyvistaqt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# GUI code: the Qt/VTK libraries are only partly typed.
module = ["adcssim.viz.*"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
