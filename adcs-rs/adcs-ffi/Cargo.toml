[package]
name = "adcs-ffi"
description = "C ABI for adcs-core, matching adcs-c/include/adcs.h"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "adcs_rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
adcs-core = { path = "../adcs-core" }

[lints]
workspace = true

[features]
default = ["std"]
# Host builds (the shared library loaded by the simulator). Without it: no_std, for firmware.
std = []
# Single precision, matching a C build with ADCS_USE_FLOAT.
f32 = ["adcs-core/f32"]
